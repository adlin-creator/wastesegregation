<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CleanCity - Welcome</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #f3f8f4;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 420px;

            background: white;

            padding: 35px 25px;

            border-radius: 25px;

            text-align: center;

            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        .logo {
            font-size: 65px;
            margin-bottom: 5px;
        }

        h1 {
            color: #16833a;
            font-size: 32px;
            margin: 5px 0;
        }

        .tagline {
            color: #666;
            font-size: 15px;
            margin-bottom: 35px;
        }

        .question {
            font-size: 19px;
            font-weight: bold;
            color: #333;

            margin-bottom: 20px;
        }

        .login-btn {
            width: 100%;

            padding: 16px;

            margin: 10px 0;

            border: none;

            border-radius: 13px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .user-btn {
            background: #16833a;
            color: white;
        }

        .authority-btn {
            background: #e8f4eb;
            color: #16833a;

            border: 2px solid #16833a;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 25px;

            font-size: 12px;

            color: #888;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="logo">
        🏙️
    </div>

    <h1>CleanCity</h1>

    <p class="tagline">
        Smart Waste Management System
    </p>

    <div class="question">
        Who are you?
    </div>

    <!-- USER LOGIN -->

    <button class="login-btn user-btn"
            onclick="loginAsUser()">

        👤 Login as User

    </button>


    <!-- AUTHORITY LOGIN -->

    <button class="login-btn authority-btn"
            onclick="loginAsAuthority()">

        🏛️ Login as Authority

    </button>


    <div class="footer">
        Making our cities cleaner, smarter and healthier 🌱
    </div>

</div>


<script>

function loginAsUser() {
    window.location.href = "register.html";
}


function loginAsAuthority() {

    window.location.href = "authority-login.html";

}

</script>

</body>

</html>
