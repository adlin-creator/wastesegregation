<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>User Reports - CleanCity</title>

<style>

* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #f3f8f4;
}

header {
    background: #16833a;
    color: white;
    padding: 20px;
    border-radius: 0 0 20px 20px;
}

header h1 {
    margin: 0;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 20px;
}

.back {
    border: none;
    background: none;
    color: #16833a;
    font-size: 16px;
    cursor: pointer;
    margin-bottom: 15px;
}

.box {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.box h2 {
    color: #16833a;
}

.report {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}

.report h3 {
    color: #16833a;
}

.location {
    background: #eef7f0;
    padding: 12px;
    border-radius: 10px;
    margin-top: 12px;
}

.status {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 20px;
    background: #fff3cd;
    color: #856404;
    margin-top: 8px;
    font-size: 13px;
}

select {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: 1px solid #ccc;
    border-radius: 10px;
}

.update {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: #16833a;
    color: white;
    font-size: 15px;
}

.photo {
    width: 100%;
    height: 150px;
    background: #e8f4eb;
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #16833a;
    font-size: 16px;
    margin-top: 12px;
}

</style>

</head>

<body>

<header>

<h1>📋 CleanCity</h1>

<p>User Reports & Complaints</p>

</header>


<div class="container">

<button class="back"
        onclick="goBack()">

← Back to Authority Home

</button>


<div class="box">

<h2>📊 Complaint Overview</h2>

<p>
View citizen reports, locations and
update their current status.
</p>

</div>


<div id="reportsContainer">

    <div class="box">
        <h2>⏳ Loading Reports...</h2>
        <p>Please wait while complaints are loaded.</p>
    </div>

</div>

<script>

function goBack() {

    window.location.href =
        "authority-home.html";

}


async function loadReports() {

    const container =
        document.getElementById("complaintsContainer");

    try {

        const response = await fetch(
            "https://wastesegregation-production.up.railway.app/all-reports"
        );

const text = await response.text();

console.log("Reports response:", text);

if (!response.ok) {
    throw new Error("Server returned " + response.status);
}

const reports = JSON.parse(text);
        if (!response.ok) {
            throw new Error(
                reports.message ||
                "Unable to load reports"
            );
        }

        container.innerHTML = "";

        if (reports.length === 0) {

            container.innerHTML = `
                <div class="box">
                    <h2>📭 No Reports</h2>
                    <p>No citizen complaints have been submitted yet.</p>
                </div>
            `;

            return;
        }

        reports.forEach(function(report) {

            container.innerHTML += `

                <div class="report">

                    <h3>
                        🗑️ ${report.waste_type}
                    </h3>

                    <p>
                        <strong>Complaint ID:</strong>
                        ${report.report_id}
                    </p>

                    <p>
                        <strong>Reported by:</strong>
                        ${report.user_email || "Citizen"}
                    </p>

                    <p>
                        <strong>Problem:</strong>
                        ${report.problem_type}
                    </p>

                    <p>
                        <strong>Description:</strong><br>
                        ${report.description}
                    </p>

                    <div class="location">

                        📍 <strong>Location</strong><br>

                        Ward:
                        ${report.ward || "Not assigned"}
                        <br>

                        Latitude:
                        ${report.latitude || "Not available"}
                        <br>

                        Longitude:
                        ${report.longitude || "Not available"}

                    </div>

                    <p>

                        <strong>Status:</strong>

                        <br>

                        <span class="status"
                              id="status-${report.report_id}">

                            ${report.status}

                        </span>

                    </p>

                    <select id="select-${report.report_id}">

                        <option value="Pending"
                            ${report.status === "Pending" ? "selected" : ""}>
                            Pending
                        </option>

                        <option value="Assigned"
                            ${report.status === "Assigned" ? "selected" : ""}>
                            Assigned
                        </option>

                        <option value="In Progress"
                            ${report.status === "In Progress" ? "selected" : ""}>
                            In Progress
                        </option>

                        <option value="Resolved"
                            ${report.status === "Resolved" ? "selected" : ""}>
                            Resolved
                        </option>

                        <option value="Rejected"
                            ${report.status === "Rejected" ? "selected" : ""}>
                            Rejected
                        </option>

                    </select>

                    <button class="update"
                            onclick="updateStatus('${report.report_id}')">

                        Update Complaint Status

                    </button>

                </div>

            `;

        });

    } catch (error) {

        console.error(
            "Reports loading error:",
            error
        );
          alert(error.message);

        container.innerHTML = `

            <div class="box">

                <h2>⚠️ Unable to Load Reports</h2>

                <p>
                    Please make sure the CleanCity backend
                    is running.
                </p>

            </div>

        `;
    }
}


async function updateStatus(reportId) {

    const select =
        document.getElementById(
            "select-" + reportId
        );

    const selectedStatus =
        select.value;

    try {
const response = await fetch(
    "https://wastesegregation-production.up.railway.app/reports/"
    + reportId
    + "/status",
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    status: selectedStatus
                })
            }
        );

        const data =
            await response.json();

        if (!response.ok) {

            alert(
                data.message ||
                "Unable to update complaint status."
            );

            return;
        }

        alert(
            data.message ||
            "Complaint status updated successfully."
        );

        loadReports();

    } catch (error) {

        console.error(
            "Status update error:",
            error
        );

        alert(
            "Unable to connect to the CleanCity backend."
        );
    }
}


loadReports();

</script>

</body>

</html>
